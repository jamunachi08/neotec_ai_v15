[project]
name = "neotec_ai"
authors = [
    { name = "Neotec Integrated Solutions", email = "support@neotec.ai" }
]
description = "One governed AI platform for ERPNext: assistant, BI, coworkers, automation and a shared AI gateway"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # requests and croniter ship with Frappe; nothing extra required
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
